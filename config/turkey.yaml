country: "TR"

data_sources:
  powerplants_raw_file: "teias_powerplants.SYNTHETIC.csv"
  demand_raw_file: "turkey_demand_2023.csv.csv"
  buses_raw_file: "teias_buses.SYNTHETIC.csv"
  lines_raw_file: "teias_lines.SYNTHETIC.csv"

scenario:
  active: "shura_2030"
  snapshot_resolution_hours: 3
  modes:
    baseline_2023:
      extendable: false
      co2_limit_mt: null
      renewable_share_min: null
    shura_2030:
      extendable: true
      co2_limit_mt: 140.0
      renewable_share_min: 0.50

conventional:
  carriers: ["CCGT", "gas", "coal", "lignite", "geothermal", "nuclear", "oil"]

extendable_technologies:
  carriers: ["solar", "wind", "gas"]
  costs:
    solar:
      capital_cost_eur_per_kw: 55.0
      co2_t_per_mwh: 0.0
      p_nom_max_mw: null
    wind:
      capital_cost_eur_per_kw: 105.0
      co2_t_per_mwh: 0.0
      p_nom_max_mw: 140000
    gas:
      capital_cost_eur_per_kw: 75.0
      co2_t_per_mwh: 0.40
      p_nom_max_mw: null

transmission:
  extendable: true
  capital_cost_eur_per_mw: 400.0

battery:
  extendable: true
  capital_cost_eur_per_kwh: 150.0
  capital_cost_eur_per_kw: 100.0
  efficiency_charge: 0.92
  efficiency_discharge: 0.92

hydro:
  ror:
    flat_capacity_factor: 0.45
  reservoir:
    buses: ["Güneydoğu Anadolu", "Doğu Anadolu", "Karadeniz"]
    max_hours: 1200
    efficiency_dispatch: 0.90
  e_sum_max_mwh: 65000000
